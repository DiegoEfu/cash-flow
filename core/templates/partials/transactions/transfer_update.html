<label for="id_to_account" hx-swap-oob="true" class="form-label">To Account ({{to_account.currency.code}}):</label>
<span id="currency_to_acc" hx-swap-oob="true">{{to_account.currency.code}}</span>  
<span hx-swap-oob="true" id="current_balance_to_acc"> {{to_account.current_balance}} </span>

<span id="final_balance" hx-swap-oob="true">{{final_from}}</span>

<input required type="number" hx-include="input, select" hx-trigger="keyup changed delay:1000ms" hx-get="/transfer/update/{{from_account.pk}}" hx-swap-oob="true" id="id_received_amount" name="received_amount" value="{{rec_amount}}" hx-swap="none" class="input input-bordered w-full" />
<b class="text-error">{{final_to}}<span id="currency_to_acc2" hx-swap-oob="true"> {{to_account.currency.code}}</span>  
    <span hx-swap-oob="true" id="rec_final_balance"> {{final_to}} </span></b></small>

<small class="text-xs">
    Calculated Fee: 
    <b class="text-error">
        <span id="fee" hx-swap-oob="true" class="tooltip tooltip-bottom" data-tip="{{to_account.currency.code}} {{discounted_received}}">{{ fee }} ({{from_account.currency.code}} {{effective_exchange_rate|floatformat:4}} = 1 {{to_account.currency.code}})</span>
    </b>
</small>
