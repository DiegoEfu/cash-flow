{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CashFlow - Finance Web Application</title>
    <link rel="icon" href="{% static 'img/logo.png' %}">

    <!-- EXTERNAL IMPORTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="{% static 'js/libs/htmx.min.js' %}" integrity="sha384-ujb1lZYygJmzgSwoxRggbCHcjc0rB2XoQrxeTUQyRjrOnlCoYta87iKBWq3EsdM2" crossorigin="anonymous"></script>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.11.1/dist/full.min.css" rel="stylesheet" type="text/css" />

    <!-- INTERNAL IMPORTS -->
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">

    {% block head %}
    {% endblock %}
</head>
<body class="bg-base-300 text-base-content min-h-screen font-sans antialiased selection:bg-primary selection:text-white" hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
    <div class="flex flex-col min-h-screen bg-gradient-to-br from-base-300 via-base-200 to-base-300">
        {% include 'navbar.html' %}

        <main class="flex-grow container mx-auto px-4 py-8 max-w-7xl">
            {% block content %}
            {% endblock %}
        </main>
    </div>
    
    {% include 'footer.html' %}   
</body>
</html>
